<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<title>Testvert for EntroPi-brua — SXI-generatoren</title>
<style>
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f6;color:#111827}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1d4f4f;color:#fff}
  header strong{font-weight:600}
  .btn{padding:6px 12px;border:none;border-radius:6px;background:#10b69f;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .btn.grey{background:rgba(255,255,255,.18)}
  #log{height:120px;overflow:auto;margin:0;padding:8px 16px;background:#0f172a;color:#cbd5e1;font:11px/1.5 'JetBrains Mono',ui-monospace,monospace;white-space:pre-wrap}
  #wrap{height:calc(100vh - 190px);padding:8px 16px 16px}
  iframe{width:100%;height:100%;border:1px solid #d1d5db;border-radius:10px;background:#fff}
  .pill{padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.15);font-size:12px}
</style>
</head>
<body>
<header>
  <strong>Testvert — EntroPi</strong>
  <span class="pill" id="bygg">Storgata 1 (bygg-42)</span>
  <span class="pill" id="state">ikkje kopla</span>
  <span class="pill" id="stored">ingen lagra fil</span>
  <span style="margin-left:auto"></span>
  <button class="btn grey" id="reqSave">Ber verktøyet lagre</button>
  <button class="btn grey" id="pushSys">Send systema uoppmoda</button>
  <button class="btn grey" id="kiKey">KI-nøkkel</button>
  <button class="btn grey" id="reload">Last iframe på nytt</button>
  <button class="btn grey" id="wipe">Slett lagra fil</button>
</header>
<pre id="log"></pre>
<div id="wrap"><iframe id="fr" title="SXI-generatoren"
  allow="clipboard-write; fullscreen"></iframe></div>

<script>
// Enkel referanseimplementasjon av vertssida i protokollen som er dokumentert i
// docs/entropi-integrasjon.md. «Backend» her er berre ein variabel + IndexedDB-fri
// localStorage-nøkkel for metadata, så vi kan sjå at rundturen verkar.
const BYGG={id:'bygg-42',namn:'Storgata 1',adresse:'Storgata 1, 0155 Oslo',byggeaar:1978};
// Dei tekniske systema som ligg på bygget i EntroPi. Same forma som
// produksjonssida sender: {id, kategori, namn}.
const SYSTEMS=[
  // Ventilasjonsanlegga har tala SXI-eksporten brukar: luftmengd i m³/h
  // (verktøyet deler på arealet), gjenvinningsgrad i prosent og SFP.
  {id:'vent-201362',     kategori:'Ventilasjon', namn:'201.362',
   tilluft:7000, avtrekk:6800, tilluftRedusert:2000, avtrekkRedusert:2000,
   gjenvinning:78, sfp:1.8},
  {id:'varme-fjern',     kategori:'Varme',       namn:'Fjernvarme', effekt:250},
  {id:'varme-vp',        kategori:'Varme',       namn:'Varmepumpe'},
  {id:'kjol-fjern',      kategori:'Kjøling',     namn:'Fjernkjøling'},
  {id:'gate-1',          kategori:'Gatevarme',   namn:'Gatevarme'},
  {id:'bel-kontor',      kategori:'Belysning',   namn:'Kontorareal'},
  {id:'auto-sd',         kategori:'Automasjon',  namn:'SD anlegg: GK'},
  {id:'annet-inneklima', kategori:'Annet',       namn:'Inneklima sensorikk'}
];
// ?nosys=1 → verten kan ikkje denne meldinga. Verktøyet skal då gi ei
// forklaring etter tidsavbrotet, ikkje stå og hente i det uendelege.
const NOSYS=new URLSearchParams(location.search).has('nosys');
const fr=document.getElementById('fr');
const logEl=document.getElementById('log');
let lagraTekst=null;                     // «fila på bygget»
let dirty=false;

const log=(...a)=>{logEl.textContent+=a.join(' ')+'\n';logEl.scrollTop=logEl.scrollHeight;};
const send=m=>fr.contentWindow.postMessage(Object.assign({source:'entropi'},m),'*');
const setState=t=>document.getElementById('state').textContent=t;
const setStored=()=>document.getElementById('stored').textContent=
  lagraTekst?('lagra fil: '+(lagraTekst.length/1024/1024).toFixed(2)+' MB'):'ingen lagra fil';

window.addEventListener('message',async ev=>{
  const d=ev.data;
  if(!d||d.source!=='sxi-generator')return;
  log('◀ '+d.type+(d.auto?' (auto)':'')+(d.requestId?' #'+d.requestId:'')+(d.filename?' '+d.filename:'')+(d.bytes?' ('+(d.bytes/1024|0)+' kB)':''));

  if(d.type==='sxi:ready'){
    setState('kopla — v'+(d.version||'?'));
    // ?silent=1 → verten svarar ikkje. Då skal verktøyet oppføre seg
    // som om det ikkje var innbygd i det heile (nedlasting av .entro).
    if(new URLSearchParams(location.search).has('silent')){
      log('  (silent: sender ikkje init)');
      return;
    }
    send({type:'sxi:init',
      bygg:BYGG,
      brukar:{namn:'Test Testesen'},   // den innlogga → «Ansvarleg person»
      project:lagraTekst||null,      // strengen frå førre lagring
      wantsSxi:true,
      // Utelaten ⇒ verktøyet brukar standardintervallet (2 min).
      // ?autosave=0 slår det av, ?autosave=30000 kortar det ned.
      ...(new URLSearchParams(location.search).has('autosave')
          ?{autosaveMs:Number(new URLSearchParams(location.search).get('autosave'))}
          :{}),
      saveLabel:'Lagre på bygget'});
    log('▶ sxi:init'+(lagraTekst?' (med prosjekt)':' (tomt bygg)'));
    return;
  }
  if(d.type==='sxi:state'){
    dirty=!!d.dirty;
    setState('kopla — '+(dirty?'ulagra endringar':'lagra'));
    return;
  }
  if(d.type==='sxi:save'){
    try{
      lagraTekst=await d.blob.text();       // her ville EntroPi lasta opp til lagring
      setStored();
      log('  lagra '+d.filename+' — '+JSON.stringify(d.meta));
      send({type:'sxi:save-result',requestId:d.requestId,ok:true,
        message:'Lagra på '+BYGG.namn+'.'});
    }catch(e){
      send({type:'sxi:save-result',requestId:d.requestId,ok:false,message:e.message});
    }
    return;
  }
  if(d.type==='sxi:request-systems'){
    if(NOSYS){log('  (nosys: svarar ikkje)');return;}
    send({type:'sxi:systems',requestId:d.requestId,ok:true,systems:SYSTEMS});
    log('▶ sxi:systems ('+SYSTEMS.length+' system)');
    return;
  }
  if(d.type==='sxi:export-sxi'){
    log('  fekk SXI-fil '+d.filename+' — '+d.bytes+' teikn');
    return;
  }
  if(d.type==='sxi:ai-request'){
    log('  KI: '+d.oppgave+', '+(d.images||[]).length+' bilete ('
      +((d.images||[]).reduce((s,b)=>s+b.data.length,0)/1024|0)+' kB)'+(d.meta&&d.meta.sone?' — '+d.meta.sone:''));
    send({type:'sxi:ai-ack',requestId:d.requestId});
    try{
      const result=KIMOCK?await kiMock(d):await kiClaude(d);
      send({type:'sxi:ai-result',requestId:d.requestId,ok:true,result});
      log('▶ sxi:ai-result #'+d.requestId);
    }catch(e){
      send({type:'sxi:ai-result',requestId:d.requestId,ok:false,message:e.message});
      log('▶ sxi:ai-result #'+d.requestId+' FEIL: '+e.message);
    }
    return;
  }
});

// ── KI-oppteikning ──
// Produksjonssida kallar Claude på serveren med sin eigen nøkkel. Testverten
// kan gjere det same rett frå nettlesaren med ein nøkkel du legg inn sjølv
// (berre lokalt, berre her), eller svare med eit fast oppdikta forslag
// (?kimock=1) så heile flyten i verktøyet kan testast utan nøkkel.
const KIMOCK=new URLSearchParams(location.search).has('kimock');
const KI_NOKKEL='testvertKiNokkel';
async function kiMock(d){
  await new Promise(r=>setTimeout(r,1200));
  if(d.oppgave==='soner')return{analyse:'Oppdikta svar frå testverten (?kimock=1): tre soner — éi til venstre, to til høgre.',
    soner:[
      {namn:'Fløy A',bruk:'Kontorbygg',byggeaar:0,pts:[{x:200,y:250},{x:500,y:250},{x:500,y:700},{x:200,y:700}]},
      {namn:'Tilbygg 1997',bruk:'Ukjend',byggeaar:1997,pts:[{x:503,y:252},{x:800,y:250},{x:800,y:470},{x:500,y:472}]},
      {namn:'Lager',bruk:'Ukjend',byggeaar:0,pts:[{x:500,y:476},{x:800,y:474},{x:800,y:700},{x:498,y:701}]}
    ]};
  // Tre like vindauge på kvar nummerert vegg (vert éi gruppe ×3), eitt
  // breiare på den fyrste (eige element), og ei dør der.
  const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  const opningar=[];
  ((d.meta&&d.meta.vegger)||[]).forEach((v,i)=>{
    [0.3,0.5,0.7].forEach(t=>opningar.push({vegg:v.nr,type:'vindauge',a:lerp(v.a,v.b,t-0.05),b:lerp(v.a,v.b,t+0.05),merke:''}));
    if(i===0){
      opningar.push({vegg:v.nr,type:'vindauge',a:lerp(v.a,v.b,0.8),b:lerp(v.a,v.b,0.95),merke:''});
      opningar.push({vegg:v.nr,type:'dor',a:lerp(v.a,v.b,0.05),b:lerp(v.a,v.b,0.15),merke:''});
    }
  });
  return{opningar};
}
async function kiClaude(d){
  let key='';try{key=localStorage.getItem(KI_NOKKEL)||'';}catch(e){}
  if(!key)throw new Error('Testverten har ingen API-nøkkel — trykk «KI-nøkkel», eller opne med ?kimock=1.');
  const {default:Anthropic}=await import('https://esm.sh/@anthropic-ai/sdk');
  const client=new Anthropic({apiKey:key,dangerouslyAllowBrowser:true});
  // Same førespurnad som EntroPi-sida skal sende — sjå docs/entropi-integrasjon.md
  const msg=await client.beta.messages.create({
    model:'claude-opus-5-5',
    max_tokens:Math.min(d.maxTokens||16000,32000),
    thinking:{type:'adaptive'},
    output_config:{effort:'high',format:{type:'json_schema',schema:d.schema}},
    betas:['server-side-fallback-2026-07-01'],
    fallbacks:'default',
    messages:[{role:'user',content:[
      ...d.images.map(b=>({type:'image',source:{type:'base64',media_type:b.mediaType,data:b.data}})),
      {type:'text',text:d.prompt}
    ]}]
  });
  if(msg.stop_reason==='refusal')throw new Error('Claude avslo førespurnaden.');
  if(msg.stop_reason==='max_tokens')throw new Error('Svaret vart for langt og er avkorta.');
  const text=msg.content.filter(c=>c.type==='text').map(c=>c.text).join('');
  log('  KI: '+msg.usage.input_tokens+' inn / '+msg.usage.output_tokens+' ut');
  return JSON.parse(text);
}
document.getElementById('kiKey').onclick=()=>{
  const k=(prompt('Anthropic API-nøkkel for testverten (vert lagra i localStorage her):')||'').trim();
  try{k?localStorage.setItem(KI_NOKKEL,k):localStorage.removeItem(KI_NOKKEL);}catch(e){}
  log(k?'KI-nøkkel lagra':'KI-nøkkel fjerna');
};

document.getElementById('reqSave').onclick=()=>{send({type:'sxi:request-save'});log('▶ sxi:request-save');};
document.getElementById('reload').onclick=()=>{fr.src=fr.src;setState('lastar…');};
// Uoppmoda push — verten kan sende lista når han vil, t.d. når nokon har lagt
// inn eit nytt system i EntroPi medan verktøyet står ope.
document.getElementById('pushSys').onclick=()=>{
  send({type:'sxi:systems',systems:SYSTEMS});log('▶ sxi:systems (uoppmoda)');};
document.getElementById('wipe').onclick=()=>{lagraTekst=null;setStored();log('lagra fil sletta');};
document.getElementById('bygg').textContent=BYGG.namn+' ('+BYGG.id+')';
setStored();
// ?silent=1 lastar verktøyet slik EntroPi gjer det i dag — utan ?embed=1 og
// utan at verten svarar — for å sjekke at nedlastinga av .entro er uendra.
const SILENT=new URLSearchParams(location.search).has('silent');
if(SILENT)document.getElementById('state').textContent='silent — svarar ikkje';
fr.src='../index.html'+(SILENT?'':'?embed=1');
</script>
</body>
</html>
